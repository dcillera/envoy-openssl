date: August 19, 2025

bug_fixes:
# *Changes expected to improve the state of the world and are unlikely to have negative effects*
- area: oauth2
  change: |
    Fixed an issue where cookies prefixed with ``__Secure-`` or ``__Host-`` were not receiving a
    Secure attribute (`CVE-2025-55162 <https://github.com/envoyproxy/envoy/security/advisories/GHSA-95j4-hw7f-v2rh>`_).

removed_config_or_runtime:
# *Normally occurs at the end of the* :ref:`deprecation period <deprecated>`

new_features:
- area: http
  change: |
    Added :ref:`ignore_http_11_upgrade
    <envoy_v3_api_field_config.core.v3.Http1ProtocolOptions.ignore_http_11_upgrade>`
    to ignore HTTP/1.1 Upgrade values matching any of the supplied matchers.
